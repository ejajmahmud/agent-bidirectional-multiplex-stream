[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bidirectional-multiplex-stream"
version = "0.1.0"
description = "Lightweight multiplexed asynchronous duplex streaming protocol for high-throughput multi-agent inter-process channels"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-bidirectional-multiplex-stream = "agent_bidirectional_multiplex_stream.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_bidirectional_multiplex_stream*"]
